worker_processes 1;

# Nell'immagine ufficiale questi file sono link a stderr/stdout:
# i log si leggono con `docker logs`.
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    server_tokens off;

    server {
        # Il container sta dietro un reverse proxy che termina TLS:
        # risponde a qualunque nome di host.
        listen 80 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/snippets/security-headers.conf;

        # Health check del container (HEALTHCHECK nel Dockerfile)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Link di condivisione generati dall'app: /import/<tessera in Base64>
        location ~ ^/import/.+$ {
            try_files /import.html =404;
        }

        # /.well-known/assetlinks.json è servito come file statico:
        # mime.types lo dichiara già application/json.
        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # add_header in una location annulla quelli ereditati dal server
            include /etc/nginx/snippets/security-headers.conf;
        }
    }
}
