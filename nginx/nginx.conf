worker_processes 1;

# Nell'immagine ufficiale questi file sono link a stderr/stdout:
# i log si leggono con `docker logs`.
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain;

    server {
        # Il container sta dietro un reverse proxy che termina TLS:
        # risponde a qualunque nome di host.
        listen 80 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/snippets/security-headers.conf;

        error_page 404 /404.html;

        # Health check del container (HEALTHCHECK nel Dockerfile)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Link di condivisione generati dall'app: /import/<tessera in Base64URL>.
        # La pagina legge la tessera dall'URL nel browser; i link non vanno indicizzati.
        location ~ ^/import/.+$ {
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers.conf;
            try_files /import.html =404;
        }

        # /.well-known/assetlinks.json è servito come file statico:
        # mime.types lo dichiara già application/json.
        location / {
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri $uri/ =404;
        }

        # CSS e JS hanno nomi fissi: il browser li riconvalida (ETag) a ogni visita.
        location ~* \.(css|js)$ {
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers.conf;
        }

        # I font cambiano solo con un nome di file nuovo.
        location ~* \.woff2$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Screenshot e registrazioni: si aggiornano a ogni release dell'app.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp4)$ {
            add_header Cache-Control "public, max-age=604800";
            include /etc/nginx/snippets/security-headers.conf;
        }
    }
}
